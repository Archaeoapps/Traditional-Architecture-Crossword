<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Millionaire Quiz</title><link rel="stylesheet" href="../shared.css"><style>
.layout{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:18px}.lifelines{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.question{padding:28px;text-align:center;font-size:clamp(1.5rem,3vw,2.5rem)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.answer{padding:18px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;cursor:pointer;font-size:1.15rem}.answer.selected{border-color:var(--gold);background:#fff0c7}.answer.correct{background:#dcebd7;border-color:var(--green)}.answer.wrong{background:#f3d0c9;border-color:var(--red)}.ladder{padding:10px;display:flex;flex-direction:column-reverse;gap:4px}.step{padding:8px;text-align:center;border-radius:7px}.step.active{background:var(--gold);font-weight:700}.controls{display:flex;gap:10px;justify-content:center;margin-top:15px;flex-wrap:wrap}@media(max-width:800px){.layout{grid-template-columns:1fr}.ladder{display:none}.answers{grid-template-columns:1fr}.lifelines{grid-template-columns:1fr}}
</style></head><body><header class="topbar"><h1>Millionaire Quiz</h1><p class="subtitle">Cyprus Folk Arts & Culture</p><a class="home-link" href="../">Παιχνίδια</a></header><main class="shell">
<div class="team-strip"><div class="team panel"><b>Ομάδα Α</b><span id="scoreA" class="score">0</span></div><div class="team b panel"><b>Ομάδα Β</b><span id="scoreB" class="score">0</span></div></div>
<div class="layout"><section><div class="lifelines"><button class="btn warn" id="fifty">50:50</button><button class="btn alt" id="classBtn">Ρώτα την τάξη</button><button class="btn" id="hintBtn">Υπόδειξη</button></div><div class="panel question"><small id="counter"></small><div id="question"></div></div><div id="answers" class="answers"></div><div class="controls"><select id="team" class="btn light"><option value="A">Ομάδα Α</option><option value="B">Ομάδα Β</option></select><button id="lock" class="btn">Κλείδωμα απάντησης</button><button id="next" class="btn light">Επόμενη</button></div><p id="message" style="text-align:center;font-weight:bold"></p></section><aside id="ladder" class="ladder panel"></aside></div></main>
<script src="game.js"></script></body></html>

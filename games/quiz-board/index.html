<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Board</title><link rel="stylesheet" href="../shared.css"><style>
.board{display:grid;gap:10px}.cat-row,.q-row{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:10px}.cat{padding:18px 8px;color:white;text-align:center;border-radius:10px;background:var(--navy);font-size:1.25rem}.cat:nth-child(3n+1){background:var(--terracotta)}.cat:nth-child(3n+2){background:var(--olive)}.tile{min-height:88px;background:var(--paper);border:2px solid var(--line);border-radius:10px;font-size:2rem;font-weight:700;color:var(--navy);cursor:pointer}.tile.used{visibility:hidden}.tools{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
</style></head><body><header class="topbar"><h1>Quiz Board</h1><p class="subtitle">Cyprus Folk Arts & Culture</p><a class="home-link" href="../">Παιχνίδια</a></header><main class="shell">
<div class="team-strip"><div class="team panel"><b>Ομάδα Α</b><span id="scoreA" class="score">0</span></div><div class="team b panel"><b>Ομάδα Β</b><span id="scoreB" class="score">0</span></div></div>
<section id="board" class="board"></section><div class="tools"><button class="btn light" id="reset">Νέο παιχνίδι</button></div></main>
<div id="modal" class="modal hidden"><div class="modal-card"><p id="meta"></p><h2 id="question"></h2><p id="answer" hidden></p><div class="actions"><button class="btn light" id="show">Αποκάλυψη απάντησης</button><button class="btn alt" data-award="A">✓ Ομάδα Α</button><button class="btn warn" data-award="B">✓ Ομάδα Β</button><button class="btn" id="close">Χωρίς βαθμούς</button></div></div></div>
<script src="game.js"></script></body></html>

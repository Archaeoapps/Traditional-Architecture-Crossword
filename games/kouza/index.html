<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Έσπασεν η κούζα · Cyprus Folk Arts & Culture</title>
<link rel="stylesheet" href="../shared.css">
<style>
.kouza-shell{max-width:1500px}
.kouza-layout{display:grid;grid-template-columns:215px minmax(0,1fr) minmax(290px,350px);gap:18px;align-items:start}
.score-rail{display:grid;gap:12px;align-content:start}
.score-card{padding:16px;border-left:7px solid var(--navy);position:relative}
.score-card.b{border-color:var(--terracotta)}
.score-card.active{outline:2px solid var(--gold);outline-offset:2px}
.score-card small{display:block;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:.68rem}
.score-card strong{font-size:1.18rem}
.big-score{display:block;font-size:3rem;color:var(--navy);margin-top:5px;font-variant-numeric:tabular-nums}
.turn-card{padding:15px;display:grid;gap:9px}
.turn-card strong{font-size:1.3rem;color:var(--navy)}
.timer{font-size:2.7rem;color:var(--navy);font-weight:bold;font-variant-numeric:tabular-nums;line-height:1.15}
.timer.urgent{color:var(--red)}
.time-track{height:8px;background:#ded2ba;border-radius:20px;overflow:hidden}
#timeBar{display:block;height:100%;width:100%;background:var(--olive)}
#timeBar.urgent{background:var(--terracotta)}
#start{width:100%}
.game-stage{padding:18px;min-width:0}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stage-head h2{margin:0;color:var(--navy)}
.word-frame{min-height:180px;padding:24px 12px;display:grid;place-items:center;text-align:center;position:relative;background:linear-gradient(180deg,#fffaf0,#f5e8d0);border:7px solid #996b3d;border-radius:16px;box-shadow:inset 0 0 0 3px #d5a86d,var(--shadow-soft)}
.word{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:7px;max-width:100%;font-size:clamp(1.3rem,3.8vw,3.8rem);font-weight:700;color:var(--navy);line-height:1.2}
.word.waiting{font-size:clamp(1.05rem,2.2vw,1.8rem);color:var(--muted);font-weight:400}
.word-group{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:5px}
.letter{display:inline-grid;place-items:center;min-width:.83em;height:1.3em;border-bottom:3px solid var(--navy)}
.letter.punct{border:0;min-width:.35em}
.letter.missed{color:var(--terracotta)}
.hint{margin-top:13px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:center}
.hint-icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--terracotta);color:white;font-size:1.4rem}
.hint b{display:block;margin-bottom:3px}.hint small{display:block;color:var(--muted);margin-top:4px}
#hint{font-size:clamp(1rem,1.65vw,1.3rem)}
.keyboard{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;margin-top:14px}
.key{min-height:53px;padding:8px 2px;background:linear-gradient(180deg,#fffaf0,#efe3ce);border:1px solid var(--line);border-radius:10px;font-size:1.3rem;font-weight:700;color:var(--navy);cursor:pointer}
.key:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.key:disabled{opacity:.55;cursor:not-allowed}
.key.hit{background:#dce7d3;color:#294a31;border-color:#95ab89;opacity:1}
.key.miss{background:#f0d0c8;color:#96392e;border-color:#c9806c;opacity:1}
.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:15px}
.kuza-panel{padding:19px 14px;display:grid;place-items:center;text-align:center;min-width:0}
.kuza-title{margin:0;color:var(--navy);font-size:1.2rem}
.kuza-art{display:block;width:100%;max-width:320px;height:auto;aspect-ratio:440/500;object-fit:contain;filter:drop-shadow(0 9px 5px #5d351b18);margin:7px auto}
.status{margin:8px 0 0;font-weight:700;font-size:1.08rem;color:var(--navy);min-height:3em;line-height:1.4}
.mistakes{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.error-dots{display:flex;gap:9px;justify-content:center;margin:10px 0}
.error-dots span{width:22px;height:22px;border-radius:50%;background:#dfd3bf;border:1px solid #cdbfa5}
.error-dots span.used{background:var(--terracotta);border-color:#9c452e}
#roundCounter{font-variant-numeric:tabular-nums}
@media(max-width:1100px){.kouza-layout{grid-template-columns:190px minmax(0,1fr) minmax(220px,280px);gap:12px}.game-stage{padding:12px}.keyboard{grid-template-columns:repeat(6,1fr)}}
@media(max-width:900px){.kouza-layout{grid-template-columns:minmax(0,1fr) minmax(190px,32%)}.score-rail{grid-column:1/-1;grid-template-columns:1fr 1fr 1.2fr}.game-stage{grid-column:1}.kuza-panel{grid-column:2}.turn-card{padding:10px}}
@media(max-width:600px){.kouza-layout{grid-template-columns:1fr}.score-rail{grid-template-columns:1fr 1fr}.turn-card{grid-column:1/-1}.game-stage,.kuza-panel{grid-column:1}.word-frame{min-height:130px}.kuza-art{max-width:220px}.key{min-height:43px}.score-card{padding:10px}.big-score{font-size:2.2rem}}
</style>
</head>
<body>
<header class="topbar">
  <p class="era">18ος–20ός αιώνας · Παραδοσιακή Κύπρος</p>
  <h1>Έσπασεν η κούζα</h1>
  <p class="subtitle">Μάντεψε τη λέξη πριν σπάσει η κούζα</p>
  <a class="home-link" href="../">⌂ Παιχνίδια</a>
</header>
<main class="shell kouza-shell">
<div class="kouza-layout">
<aside class="score-rail" aria-label="Βαθμολογία και χρόνος">
<section id="cardA" class="score-card panel"><small>Μπλε ομάδα</small><strong>Ομάδα Α</strong><span id="scoreA" class="big-score">0</span></section>
<section id="cardB" class="score-card b panel"><small>Κεραμιδί ομάδα</small><strong>Ομάδα Β</strong><span id="scoreB" class="big-score">0</span></section>
<section class="turn-card panel"><span class="section-label">Σειρά</span><strong id="activeTeam">Ομάδα Α</strong><small id="roundCounter"></small><span class="section-label">Χρόνος</span><span id="timer" class="timer" role="timer">02:00</span><div class="time-track" aria-hidden="true"><span id="timeBar"></span></div><button id="start" class="btn alt" disabled>▶ Έναρξη 120″</button></section>
</aside>
<section class="game-stage panel">
<div class="stage-head"><div><span class="section-label">Κρυφή λέξη</span><h2>Ποια είναι;</h2></div><div><span id="letterCount" aria-live="polite"></span> <span class="badge">3 λάθη = σπάσιμο</span></div></div>
<div class="word-frame"><div id="word" class="word" aria-label="Κρυφή λέξη">Φόρτωση…</div></div>
<div class="hint panel"><span class="hint-icon">✦</span><div><b>Υπόδειξη</b><span id="hint"></span><small id="category"></small></div></div>
<div id="keyboard" class="keyboard" aria-label="Ελληνικό πληκτρολόγιο"></div>
<div class="controls"><button id="next" class="btn" disabled>Επόμενη λέξη →</button><button id="reset" class="btn light" disabled>↻ Νέο παιχνίδι</button></div>
</section>
<aside class="kuza-panel panel">
<p class="kuza-title">Πρόσεχε την κούζα!</p>
<img id="kouzaGraphic" class="kuza-art" src="assets/kouza-0.png" width="440" height="500" alt="Άθικτη φοινιώτικη κούζα">
<div id="errors" class="error-dots" aria-hidden="true"><span></span><span></span><span></span></div>
<p id="mistakes" class="mistakes">Λάθη: 0 / 3</p>
<p id="status" class="status" role="status" aria-live="polite">Φόρτωση λέξεων…</p>
</aside>
</div>
</main>
<script src="game.js?v=4"></script>
</body></html>

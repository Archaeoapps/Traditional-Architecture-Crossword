<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Έσπασεν η κούζα</title><link rel="stylesheet" href="../shared.css"><style>
.game{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.word{font-size:clamp(2.2rem,6vw,5rem);letter-spacing:.18em;text-align:center;padding:45px 12px}.hint{padding:18px;font-size:1.3rem}.keyboard{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-top:14px}.key{padding:13px 5px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:1.35rem;cursor:pointer}.key:disabled{opacity:.35}.kuza-wrap{display:grid;place-items:center;min-height:420px}.kuza{width:210px;height:300px;position:relative;background:linear-gradient(90deg,#a8462e,#d67d4d 22%,#e89a60 50%,#ca6d43 78%,#9f3f2a);border-radius:42% 42% 35% 35% / 18% 18% 56% 56%;border:8px solid #713421;box-shadow:inset 0 0 0 8px #e2a06f}.kuza:before{content:"";position:absolute;width:125px;height:45px;left:35px;top:-34px;background:#c66c40;border:8px solid #713421;border-radius:50%}.kuza:after{content:"◆  ◆  ◆\A ◇  ◇  ◇\A ◆  ◆  ◆";white-space:pre;position:absolute;inset:70px 20px;text-align:center;font-size:34px;line-height:2;color:#253f45;opacity:.8}.crack{position:absolute;background:#fff3df;width:6px;transform-origin:top;display:none;z-index:3}.c1{height:130px;left:55%;top:10px;transform:rotate(14deg)}.c2{height:120px;left:63%;top:105px;transform:rotate(-25deg)}.c3{height:95px;left:45%;top:170px;transform:rotate(35deg)}.c4{height:70px;left:34%;top:88px;transform:rotate(-38deg)}.c5{height:85px;left:72%;top:180px;transform:rotate(22deg)}.c6{height:75px;left:27%;top:205px;transform:rotate(-18deg)}.status{text-align:center;font-weight:700;font-size:1.2rem}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}@media(max-width:850px){.game{grid-template-columns:1fr}.kuza-wrap{min-height:330px}.keyboard{grid-template-columns:repeat(6,1fr)}}
</style></head><body><header class="topbar"><h1>Έσπασεν η κούζα</h1><p class="subtitle">Μάντεψε τη λέξη πριν σπάσει η κούζα</p><a class="home-link" href="../">Παιχνίδια</a></header><main class="shell">
<div class="team-strip"><div class="team panel"><b>Ομάδα Α</b><span id="scoreA" class="score">0</span></div><div class="team b panel"><b>Ομάδα Β</b><span id="scoreB" class="score">0</span></div></div>
<div class="game"><section><div id="word" class="word panel"></div><div class="hint panel"><b>Υπόδειξη:</b> <span id="hint"></span><br><small id="category"></small></div><div id="keyboard" class="keyboard"></div><div class="controls"><button id="awardA" class="btn alt">+10 Ομάδα Α</button><button id="awardB" class="btn warn">+10 Ομάδα Β</button><button id="next" class="btn">Επόμενο</button><button id="reset" class="btn light">Νέο παιχνίδι</button></div></section>
<aside class="panel kuza-wrap"><div><div class="kuza"><i class="crack c1"></i><i class="crack c2"></i><i class="crack c3"></i><i class="crack c4"></i><i class="crack c5"></i><i class="crack c6"></i></div><p id="status" class="status">Η κούζα είναι άθικτη.</p></div></aside></div></main><script src="game.js"></script></body></html>
